<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bank Checklist</title>
<meta name="theme-color" content="#F3F0E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1217" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bank Checklist">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Bank Checklist</title>
<script>/* Apply the saved colour scheme and language before first paint. "nurnhe-theme" is shared by all of KK's apps on this site. */ try { const t = localStorage.getItem("nurnhe-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; const l = localStorage.getItem("bank-checklist-lang"); document.documentElement.lang = l === "sr" || l === "ru" ? l : /^(sr|hr|bs)/i.test(navigator.language) ? "sr" : "ru" } catch (e) {}</script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Onest:wght@400;500;600&display=swap">
<style>
/* Look: a calm "ledger" — warm paper with a faint dot grid, crisp white cards, cobalt ink for actions, green for done.
   Unbounded for headings and numbers, Onest for text; both cover Latin and Cyrillic. */
:root {
  --bg: #F3F0E8; --surface: #FFFFFF; --surface-2: #F8F6F0; --ink: #14202B; --muted: #5F6B76; --line: rgba(20, 32, 43, .12);
  --accent: #2742C9; --accent-ink: #FFFFFF; --accent-soft: #E2E7FB;
  --ok: #1F8A5B; --ok-soft: #DDF1E6; --warn: #B4462A; --warn-soft: #FBE6DE; --gold: #B98A1E; --gold-soft: #F6ECD3;
  --shadow: 0 1px 0 rgba(20, 32, 43, .05), 0 8px 24px rgba(20, 32, 43, .06);
  --shadow-lg: 0 18px 50px rgba(20, 32, 43, .18);
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --sans: "Onest", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1217; --surface: #171D25; --surface-2: #1C232D; --ink: #E9EDF2; --muted: #9AA5B1; --line: rgba(233, 237, 242, .12);
  --accent: #8EA2FF; --accent-ink: #0E1217; --accent-soft: #1E2647;
  --ok: #5FD19A; --ok-soft: #16302A; --warn: #F29A7A; --warn-soft: #3A211C; --gold: #E5BE5C; --gold-soft: #33290F;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .3); --shadow-lg: 0 18px 50px rgba(0, 0, 0, .6); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1217; --surface: #171D25; --surface-2: #1C232D; --ink: #E9EDF2; --muted: #9AA5B1; --line: rgba(233, 237, 242, .12);
  --accent: #8EA2FF; --accent-ink: #0E1217; --accent-soft: #1E2647;
  --ok: #5FD19A; --ok-soft: #16302A; --warn: #F29A7A; --warn-soft: #3A211C; --gold: #E5BE5C; --gold-soft: #33290F;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .3); --shadow-lg: 0 18px 50px rgba(0, 0, 0, .6); color-scheme: dark }

* { box-sizing: border-box }
html { min-height: 100% }
body { margin: 0; min-height: 100%; color: var(--ink); font: 400 15px/1.5 var(--sans);
  background: radial-gradient(var(--line) 1px, transparent 1.2px) 0 0 / 22px 22px, var(--bg); background-color: var(--bg) }
.wrap { max-width: 980px; margin: 0 auto; padding-block: 24px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px }
h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 600; letter-spacing: -.02em; text-wrap: balance }
h1 { font-size: clamp(26px, 5vw, 40px); line-height: 1.05 }
h1 em { font-style: normal; color: var(--accent) }
h2 { font-size: 22px; line-height: 1.15 }
h3 { font-size: 16px; line-height: 1.25; overflow-wrap: anywhere }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.muted { color: var(--muted) }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }

header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 20px }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0 }
.logo { width: 48px; height: 48px; flex: none; border-radius: 14px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: var(--shadow) }
.logo svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.brand-txt { display: grid; gap: 2px; min-width: 0 }
.top-end { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto }
.seg { display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; box-shadow: var(--shadow) }
.seg button { display: grid; place-items: center; min-width: 36px; height: 34px; padding: 0 9px; border: 0; background: none; border-radius: 9px; color: var(--muted); font-size: 13px; font-weight: 600; transition: background .15s, color .15s; -webkit-tap-highlight-color: transparent }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--ink); color: var(--bg) }
.seg svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
nav.tabs button { padding: 0 14px; font-size: 14px; font-weight: 500 }
.bottom-nav { display: none }
@media (max-width: 700px) {
  header.top nav.tabs { display: none }
  .logo { width: 40px; height: 40px; border-radius: 12px }
  .logo svg { width: 24px; height: 24px }
  .brand .eyebrow { font-size: 10.5px }
  .wrap { padding-block: 14px calc(104px + env(safe-area-inset-bottom, 0px)); gap: 16px }
  .bottom-nav { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; position: fixed; z-index: 15;
    left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow-lg) }
  .bottom-nav button { border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 7px 0 6px; font-size: 11.5px; font-weight: 500; color: var(--muted); border-radius: 14px; -webkit-tap-highlight-color: transparent; transition: background .15s, color .15s }
  .bottom-nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round }
  .bottom-nav button[aria-current="page"] { color: var(--accent); background: var(--accent-soft) }
  .card { padding: 16px }
}

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 22px; display: grid; gap: 14px; min-width: 0 }
.sec-head { display: flex; align-items: end; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap }
.sec-head > div { display: grid; gap: 4px }
.hint { margin: 0; font-size: 14px; color: var(--muted); max-width: 62ch }

/* Overview */
.overview { display: grid; grid-template-columns: minmax(0, 1.3fr) repeat(2, minmax(0, 1fr)); gap: 10px }
.ov { display: grid; gap: 6px; align-content: start; padding: 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow) }
.ov b { font-family: var(--display); font-weight: 600; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.03em }
.ov b small { font-size: 15px; color: var(--muted); font-weight: 500 }
.ov.main { background: var(--ink); color: var(--bg); border-color: transparent }
.ov.main .eyebrow { color: color-mix(in srgb, var(--bg) 70%, transparent) }
.ov.main b { font-size: 40px }
.segbar { display: flex; gap: 3px; margin-top: 4px }
.segbar i { flex: 1; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--bg) 22%, transparent) }
.segbar i.on { background: var(--ok) }
@media (max-width: 600px) { .overview { grid-template-columns: 1fr 1fr } .ov.main { grid-column: 1 / -1 } .ov { padding: 14px } .ov b { font-size: 26px } }

/* Checklists */
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; counter-reset: st }
.steps li { counter-increment: st; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 6px; align-items: center; border-radius: 14px }
.steps li::before { content: counter(st, decimal-leading-zero); font-family: var(--display); font-size: 11px; font-weight: 500; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums }
.steps.plain li { grid-template-columns: minmax(0, 1fr) auto }
.steps.plain li::before { content: none }
.steps li + li { border-top: 1px dashed var(--line); border-radius: 0 }
.step { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; align-items: center; padding: 9px 8px; border-radius: 12px; cursor: pointer; transition: background .15s; min-height: 48px }
.step:hover { background: var(--surface-2) }
.step input { appearance: none; -webkit-appearance: none; width: 24px; height: 24px; margin: 0; border-radius: 8px; border: 1.5px solid color-mix(in srgb, var(--muted) 55%, transparent); background: var(--surface); display: grid; place-items: center; cursor: pointer; transition: background .15s, border-color .15s }
.step input::after { content: ""; width: 10px; height: 6px; border: solid var(--surface); border-width: 0 0 2.2px 2.2px; transform: translateY(-1px) rotate(-45deg); opacity: 0 }
.step input:checked { background: var(--ok); border-color: var(--ok) }
.step input:checked::after { opacity: 1 }
.step .txt { overflow-wrap: anywhere; min-width: 0 }
.step .nm { display: block; font-weight: 500 }
.step .sub { display: block; font-size: 13px; color: var(--muted); white-space: pre-line }
.step input:checked + .txt .nm { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 70%, transparent) }
.edit-btn { border: 1px solid transparent; background: none; border-radius: 10px; width: 40px; height: 40px; padding: 0; display: grid; place-items: center; color: var(--muted) }
.edit-btn svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.edit-btn:hover { border-color: var(--line); background: var(--surface-2); color: var(--ink) }
.needed { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px }
.add-row { display: flex; gap: 8px; align-items: center }
.add-row .input { flex: 1; min-width: 0 }
.add-row .btn { white-space: nowrap; min-height: 42px }

/* Buttons, pills, forms */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 14px; font-weight: 500; font-size: 14px; transition: border-color .15s, background .15s }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.btn.ghost { background: none; border-color: transparent; color: var(--muted) }
.btn.small { padding: 6px 12px; font-size: 13px }
.btn.danger { color: var(--warn) }
.btn.danger.armed { background: var(--warn-soft); border-color: transparent }
.btn:disabled { opacity: .45; cursor: default }
.btns { display: flex; flex-wrap: wrap; gap: 6px }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 8px; white-space: nowrap; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line) }
.pill.applying { background: var(--gold-soft); color: var(--gold); border-color: transparent }
.pill.open, .pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent }
.pill.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent }
.field { display: grid; gap: 6px; font-size: 13px; font-weight: 500; color: var(--muted) }
.input { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; color: var(--ink); width: 100%; font-size: 15px; font-weight: 400 }
textarea.input { resize: vertical; min-height: 80px; line-height: 1.45 }
.choice { display: flex; flex-wrap: wrap; gap: 6px }
.choice button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 12px; font-size: 13.5px; font-weight: 500; min-height: 38px; color: var(--ink) }
.choice button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg) }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden }
.bar span { display: block; height: 100%; border-radius: 3px; background: var(--ok); transition: width .25s }
.done-badge { display: inline-flex; align-items: center; gap: 6px; background: var(--ok); color: var(--surface); font-weight: 600; font-size: 13px; padding: 4px 12px; border-radius: 10px }
.empty-state { text-align: center; padding: 32px 16px; display: grid; gap: 10px; justify-items: center; border: 1.5px dashed var(--line); border-radius: 16px }
.empty-state p { max-width: 46ch; margin: 0 }
details summary { cursor: pointer; font-size: 14px; font-weight: 500; color: var(--accent); padding: 4px 2px }

/* Banks */
.bank-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px }
.bank-card { position: relative; overflow: hidden; text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 18px; padding: 16px 16px 16px 20px; display: grid; gap: 12px; align-content: start; min-width: 0; transition: transform .15s, box-shadow .15s, border-color .15s }
.bank-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--line) }
.bank-card.st-applying::before { background: var(--gold) }
.bank-card.st-open::before { background: var(--ok) }
.bank-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-lg); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)) }
.bank-card.st-no { opacity: .55 }
.bank-card .head { display: flex; align-items: start; justify-content: space-between; gap: 8px }
.bank-card .note { margin: 0; font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere }
.prog { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; font-variant-numeric: tabular-nums }
.prog .lab { color: var(--muted); font-size: 12.5px }

/* Bank sections (collapsible) */
.bank { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden }
.bank::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--line) }
.bank.st-applying::before { background: var(--gold) }
.bank.st-open::before { background: var(--ok) }
.bank.st-no { opacity: .6 }
.bank > summary { list-style: none; display: grid; grid-template-columns: minmax(0, 1fr) auto 28px; gap: 4px 10px; align-items: center; padding: 16px 14px 16px 22px; cursor: pointer; -webkit-tap-highlight-color: transparent }
.bank > summary::-webkit-details-marker { display: none }
.bank > summary:hover { background: var(--surface-2) }
.bank .meta { grid-column: 1 / -1; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums }
.bank .chev { width: 22px; height: 22px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s; grid-row: 1; grid-column: 3 }
.bank[open] .chev { transform: rotate(180deg) }
.bank-body { padding: 4px 16px 18px 22px; display: grid; gap: 4px }
.bank-body .part { display: grid; gap: 8px; padding-block: 14px 4px; border-top: 1px solid var(--line) }
.bank-body .part:first-child { border-top: 0; padding-top: 0 }
.bank-body .part-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap }
.bank-body .eyebrow { letter-spacing: .06em }
.banks-list { display: grid; gap: 10px }
.list-head { display: flex; align-items: end; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 6px 4px 0 }

/* Documents */
.picks { display: grid; gap: 5px; padding-top: 6px }
.pick { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); cursor: pointer; transition: background .15s; overflow-wrap: anywhere; color: var(--ink); font-weight: 400; font-size: 14.5px }
.pick:has(input:checked) { box-shadow: 0 0 0 1.5px var(--accent); border-color: transparent }
.pick input { width: 17px; height: 17px; accent-color: var(--accent); margin: 0 }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(10, 16, 22, .4); z-index: 20 }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--bg); z-index: 21; box-shadow: var(--shadow-lg);
  display: grid; grid-template-rows: auto minmax(0, 1fr); border-radius: 22px 0 0 22px;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px) }
@media (max-width: 520px) { .sheet { border-radius: 0 } }
.sheet-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; padding: 20px 20px 14px; border-bottom: 1px solid var(--line); background: var(--surface) }
.sheet-head > div { display: grid; gap: 4px; min-width: 0 }
.sheet-head h2 { overflow-wrap: anywhere }
.sheet-body { overflow-y: auto; padding: 16px 16px 32px; display: grid; gap: 14px; align-content: start }
.sheet-body .card { padding: 16px; gap: 10px }
.status { font-size: 12.5px; color: var(--muted); margin: 0 }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 14px; font-size: 14px; line-height: 1.4; text-align: center; z-index: 30; box-shadow: var(--shadow-lg); width: max-content; max-width: min(420px, calc(100% - 32px)); overflow-wrap: anywhere }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: slide .22s cubic-bezier(.2, .8, .2, 1) } @keyframes slide { from { transform: translateX(32px); opacity: .6 } }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 21h18M3 10h18M5 6l7-3 7 3M4 10v11M20 10v11M8 14v3M12 14v3M16 14v3"/></svg></span>
      <div class="brand-txt"><span class="eyebrow" data-t="eyebrow"></span><h1 data-t="title"></h1></div>
    </div>
    <div class="top-end">
      <div class="seg" role="group" data-t-label="language">
        <button data-act="lang" data-lang="ru">RU</button>
        <button data-act="lang" data-lang="sr">SR</button>
      </div>
      <div class="seg" role="group" data-t-label="theme">
        <button data-act="theme" data-theme="auto" data-t-label="auto"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg></button>
        <button data-act="theme" data-theme="light" data-t-label="light"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg></button>
        <button data-act="theme" data-theme="dark" data-t-label="dark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
      </div>
      <nav class="tabs seg" role="tablist">
        <button role="tab" data-act="tab" data-tab="list" data-t="tabList"></button>
        <button role="tab" data-act="tab" data-tab="docs" data-t="tabDocs"></button>
      </nav>
    </div>
  </header>
  <main id="main" style="display:grid;gap:16px"></main>
  <p class="status" id="status"></p>
</div>
<nav class="bottom-nav">
  <button data-act="tab" data-tab="list"><svg viewBox="0 0 24 24" aria-hidden="true" data-nav="steps"></svg><span data-t="tabList"></span></button>
  <button data-act="tab" data-tab="docs"><svg viewBox="0 0 24 24" aria-hidden="true" data-nav="docs"></svg><span data-t="tabDocs"></span></button>
</nav>
<div id="sheetRoot"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* Tabler icons (MIT) for the tab bar. */
const NAV_ICONS = {

/* ---------- storage ---------- */
function normalise(d) {
  d = d && typeof d === "object" ? d : {};
  const out = { v: 3, general: Array.isArray(d.general) ? d.general : [], docs: Array.isArray(d.docs) ? d.docs : [], banks: Array.isArray(d.banks) ? d.banks : [] };
  if (d.v !== 2 && d.v !== 3) {
    /* Version 1: docs used "name", and starter items were English text. Untouched starter items become translatable;
       the company-registration steps are dropped unless they were ticked or given a note. */
    const fix = (x, txt) => {
      const note = x.note || "", old = OLD_EN[txt], k = old?.[0]; delete x.name;
      if (!old || note !== old[1]) return { ...x, text: txt, note };
      if (k === null) return x.done ? { ...x, text: txt, note } : null;
      const y = { id: x.id, key: k }; if ("done" in x) y.done = x.done; if ("ready" in x) y.ready = x.ready; return y;
    };
    out.general = out.general.map(x => fix({ ...x }, x.text)).filter(Boolean);
    out.docs = out.docs.map(x => fix({ ...x }, x.name ?? x.text)).filter(Boolean);
  }
  /* Version 3 (KK, 2026-11-02): the starting general steps are removed; only steps KK wrote or edited stay. */
  if (d.v !== 3) out.general = out.general.filter(x => !x.key);
  out.banks.forEach(b => { b.docIds ||= []; b.steps ||= []; b.status ||= "considering"; b.note ||= "" });
  return out;
}

}

  const json = JSON.stringify(S);

}
function bankPanel(b) {
  const docs = bankDocs(b), st = b.status || "considering";
  const other = S.docs.filter(d => !b.docIds.includes(d.id));
  return `<details class="bank st-${st}" data-bank="${b.id}" ${ui.open.has(b.id) ? "open" : ""}>
    <summary><h3 data-bank-name="${b.id}">${esc(b.name)}</h3><span class="pill ${st}">${t("st_" + st)}</span>${CHEV}
      <span class="meta">${t("progDocs")} ${count(docs, d => d.ready)}/${docs.length} · ${t("progSteps")} ${count(b.steps, x => x.done)}/${b.steps.length}</span></summary>
    <div class="bank-body">
      <div class="part"><span class="eyebrow">${t("status")}</span><div class="choice">${["considering", "applying", "open", "no"].map(k => `<button data-act="status" data-id="${b.id}" data-status="${k}" aria-pressed="${st === k}">${t("st_" + k)}</button>`).join("")}</div></div>
      <div class="part">
        <div class="part-head"><span class="eyebrow">${t("docsAsked")}</span><span class="pill">${t("readyOf", count(docs, d => d.ready), docs.length)}</span></div>
        ${docs.length ? `<ul class="steps plain">${docs.map(d => docRow(d, b.id)).join("")}</ul>` : `<p class="hint">${t("noneChosen")}</p>`}
        ${other.length ? `<details ${docs.length && ui.pickOpen !== b.id ? "" : "open"}><summary>${t("chooseDocs", other.length)}</summary><div class="picks">${other.map(d =>
          `<label class="pick"><input type="checkbox" data-act="link-doc" data-id="${d.id}" data-bank="${b.id}"><span>${esc(label(d))}</span></label>`).join("")}</div></details>` : ""}
        ${addForm("bank-doc", t("addNewDoc"), t("add"), b.id)}
      </div>
      <div class="part">
        <div class="part-head"><span class="eyebrow">${t("stepsHere")}</span><span class="pill">${t("doneOf", count(b.steps, x => x.done), b.steps.length)}</span></div>
        ${b.steps.length ? `<ol class="steps">${b.steps.map(x => stepRow(x, "bstep", b.id)).join("")}</ol>` : `<p class="hint">${t("bankStepsHint")}</p>`}
        ${addForm("bstep", t("addBankStep"), t("add"), b.id)}
      </div>
      <div class="part"><label class="field">${t("notes")}<textarea class="input" data-field="note" data-id="${b.id}" placeholder="${esc(t("bankNotesPh"))}">${esc(b.note)}</textarea></label></div>
      <details class="part" ${ui.armed === b.id ? "open" : ""}><summary>${t("bankSettings")}</summary>
        <div style="display:grid;gap:10px;padding-top:8px">
          <label class="field">${t("name")}<input class="input" data-field="name" data-id="${b.id}" value="${esc(b.name)}" autocomplete="off"></label>
          <div class="btns"><button class="btn danger${ui.armed === b.id ? " armed" : ""}" data-act="delete-bank" data-id="${b.id}">${ui.armed === b.id ? t("confirmDeleteBank") : t("deleteBank")}</button></div>
        </div></details>
    </div>
  </details>`;
}

function viewDocs() {
  const ready = count(S.docs, d => d.ready);
  return `<section class="card">
    <div class="sec-head"><div><span class="eyebrow">${t("papers")}</span><h2>${t("docsTitle")}</h2></div><span class="pill accent">${t("readyOf", ready, S.docs.length)}</span></div>
    <p class="hint">${t("docsHint")}</p>
    ${S.docs.length ? `<ul class="steps plain">${S.docs.map(d => docRow(d)).join("")}</ul>` : `<p class="hint">${t("noDocs")}</p>`}
    ${addForm("doc", t("addDoc"), t("add"))}
  </section>
  <section class="card">
    <div class="sec-head"><div><span class="eyebrow">${t("backupEyebrow")}</span><h3>${t("backupTitle")}</h3></div></div>
    <p class="hint">${t("backupHint")}</p>
    <div class="btns"><button class="btn small" data-act="backup">${t("saveBackup")}</button>
      <label class="btn small">${t("restore")}<input type="file" accept=".json,application/json" data-act="restore" hidden></label></div>
  </section>`;
}

function sheetItem({ kind, id, bank }) {
  const x = itemOf(kind, id, bank); if (!x) return "";
  const list = listFor(kind, bank), i = list.indexOf(x), isDoc = kind === "doc";
  const where = isDoc ? t("document") : kind === "general" ? t("generalStep") : esc(bankOf(bank)?.name);
  return `<div class="sheet-head"><div><span class="eyebrow">${where}</span><h2>${isDoc ? t("editDoc") : t("editStep")}</h2></div><button class="btn ghost" data-act="close" aria-label="${t("close")}">✕</button></div>
  <form class="sheet-body" data-form="edit-item"><section class="card">
    <label class="field">${isDoc ? t("document") : t("step")}<input class="input" name="text" value="${esc(label(x))}" required autocomplete="off"></label>
    <label class="field">${t("notes")}<textarea class="input" name="note" placeholder="${esc(isDoc ? t("docNotesPh") : t("stepNotesPh"))}">${esc(noteOf(x))}</textarea></label>
    ${isDoc && S.banks.length ? `<div class="field">${t("askedBy")}<div class="picks">${S.banks.map(b =>
      `<label class="pick"><input type="checkbox" name="bank" value="${b.id}" ${b.docIds.includes(x.id) ? "checked" : ""}><span>${esc(b.name)}</span></label>`).join("")}</div></div>` : ""}
    <div class="btns"><button type="button" class="btn small" data-act="move" data-dir="-1" ${i === 0 ? "disabled" : ""}>↑ ${t("moveUp")}</button>
      <button type="button" class="btn small" data-act="move" data-dir="1" ${i === list.length - 1 ? "disabled" : ""}>↓ ${t("moveDown")}</button></div>
  </section>
    <div class="btns"><button class="btn primary">${t("save")}</button><button type="button" class="btn ghost" data-act="close">${t("cancel")}</button>
      <button type="button" class="btn danger${ui.armed === id ? " armed" : ""}" data-act="delete-item" style="margin-left:auto">${ui.armed === id ? t("confirmDelete") : t("del")}</button></div>
  </form>`;
}

function renderChrome() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.innerHTML = t(el.dataset.t));
  document.querySelectorAll("[data-t-label]").forEach(el => { el.setAttribute("aria-label", t(el.dataset.tLabel)); if (el.tagName === "BUTTON") el.title = t(el.dataset.tLabel) });
  document.querySelectorAll("[data-act=lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  document.querySelectorAll("[data-act=tab]").forEach(b => {
    const on = b.dataset.tab === ui.tab;
    if (b.getAttribute("role") === "tab") b.setAttribute("aria-selected", on);
    else if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  if (statusKey) setStatus(statusKey);
}
function render() {
  renderChrome();
  document.getElementById("main").innerHTML = !S ? "" : ui.tab === "docs" ? viewDocs() : viewList();
  renderSheet();
  if (ui.focus) { document.getElementById(ui.focus)?.focus(); ui.focus = null }
}
function renderSheet() {
  const root = document.getElementById("sheetRoot"), s = ui.sheet;
  let html = "";
  if (S && s?.type === "item") html = sheetItem(s);
  if (!html) { if (s) ui.sheet = null; root.innerHTML = ""; document.body.style.overflow = ""; return }
  const body = root.querySelector(".sheet-body"), top = body && root.dataset.key === JSON.stringify(s) ? body.scrollTop : 0;
  root.innerHTML = `<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  root.dataset.key = JSON.stringify(s);
  root.querySelector(".sheet-body").scrollTop = top;
  document.body.style.overflow = "hidden";
}
function openSheet(s) { ui.sheet = s; ui.armed = null; document.getElementById("sheetRoot").dataset.key = ""; renderSheet() }
function closeSheet() { ui.armed = null; ui.sheet = ui.sheet?.back || null; document.getElementById("sheetRoot").dataset.key = ""; render() }

/* ---------- actions ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.tagName === "INPUT") return;
  const { act, id } = el.dataset;
  if (act !== "delete-bank" && act !== "delete-item") ui.armed = null;
  if (act === "tab") { ui.tab = el.dataset.tab; ui.sheet = null; render(); scrollTo({ top: 0 }) }
  else if (act === "lang") { lang = el.dataset.lang; try { localStorage.setItem(LANG_KEY, lang) } catch (e) {} render() }
  else if (act === "theme") setTheme(el.dataset.theme);
  else if (act === "close") closeSheet();
  else if (act === "edit") openSheet({ type: "item", kind: el.dataset.kind, id, bank: el.dataset.bank });
  else if (act === "status") { bankOf(id).status = el.dataset.status; save() }
  else if (act === "unlink-doc") { const b = bankOf(el.dataset.bank); b.docIds = b.docIds.filter(x => x !== id); save(); toast(t("removedDoc", label(docOf(id) || {}), b.name)) }
  else if (act === "delete-bank") {
    if (ui.armed !== id) { ui.armed = id; render(); return }
    const b = bankOf(id); S.banks = S.banks.filter(x => x.id !== id); ui.open.delete(id); ui.armed = null; save(); toast(t("deleted", b.name));
  }
  else if (act === "move") {
    const s = ui.sheet, list = listFor(s.kind, s.bank), i = list.findIndex(x => x.id === s.id), j = i + Number(el.dataset.dir);
    if (j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]]; save();
  }
  else if (act === "delete-item") {
    const s = ui.sheet;
    if (ui.armed !== s.id) { ui.armed = s.id; renderSheet(); return }
    const list = listFor(s.kind, s.bank), x = itemOf(s.kind, s.id, s.bank);
    list.splice(list.indexOf(x), 1);
    if (s.kind === "doc") S.banks.forEach(b => b.docIds = b.docIds.filter(d => d !== s.id));
    ui.armed = null; ui.sheet = s.back || null; save(); toast(t("deleted", label(x)));
  }
  else if (act === "backup") backup();
});
document.addEventListener("change", e => {
  const el = e.target, { act, id } = el.dataset;
  if (act === "toggle") {
    const x = itemOf(el.dataset.kind, id, el.dataset.bank); if (!x) return;
    if (el.dataset.kind === "doc") x.ready = el.checked; else x.done = el.checked;
    save();
  } else if (act === "link-doc") {
    const b = bankOf(el.dataset.bank); if (el.checked && !b.docIds.includes(id)) b.docIds.push(id); ui.pickOpen = b.id; save();
  } else if (act === "restore") restore(el.files[0]);
  else if (el.dataset.field) {
    const b = bankOf(id), v = el.value.trim();
    if (el.dataset.field === "name") { if (!v) { el.value = b.name; toast(t("needName")); return } b.name = v } else b.note = v;
    /* Don't redraw the sheet here: this fires on blur, and redrawing would swallow the tap that caused it. */
    persist();
    const h = document.querySelector(`[data-bank-name="${b.id}"]`); if (h) h.textContent = b.name;
  }
});
document.addEventListener("submit", e => {
  const f = e.target, form = f.dataset.form; if (!form) return;
  e.preventDefault();
  if (form === "edit-item") {
    const s = ui.sheet, x = itemOf(s.kind, s.id, s.bank), text = f.text.value.trim(), note = f.note.value.trim(); if (!x || !text) return;
    /* A starter item stays translatable until its words are changed. */
    if (!(x.key && text === label(x) && note === noteOf(x))) { delete x.key; x.text = text; x.note = note }
    if (s.kind === "doc") {
      const on = new Set([...f.querySelectorAll("[name=bank]:checked")].map(i => i.value));
      S.banks.forEach(b => { const has = b.docIds.includes(x.id); if (on.has(b.id) && !has) b.docIds.push(x.id); if (!on.has(b.id) && has) b.docIds = b.docIds.filter(d => d !== x.id) });
    }
    ui.sheet = s.back || null; save(); toast(t("saved"));
    return;
  }
  const text = f.text.value.trim(); if (!text) return;
  const bank = bankOf(f.dataset.bank);
  if (form === "general") S.general.push({ id: uid(), text, note: "", done: false });
  else if (form === "doc") S.docs.push({ id: uid(), text, note: "", ready: false });
  else if (form === "bstep") bank.steps.push({ id: uid(), text, note: "", done: false });
  else if (form === "bank-doc") {
    const d = S.docs.find(d => label(d).toLowerCase() === text.toLowerCase()) || (S.docs.push({ id: uid(), text, note: "", ready: false }), S.docs.at(-1));
    if (!bank.docIds.includes(d.id)) bank.docIds.push(d.id);
  } else if (form === "bank") {
    if (S.banks.some(b => b.name.toLowerCase() === text.toLowerCase())) { toast(t("dupBank", text)); return }
    const nb = { id: uid(), name: text, status: "considering", note: "", docIds: [], steps: [] };
    S.banks.push(nb); ui.open.add(nb.id); ui.pickOpen = nb.id;
    toast(t("addedBank", text));
  }
  ui.focus = "add-" + form; save();
});

async function backup() {
  const blob = new Blob([JSON.stringify({ app: "bank-checklist", saved: new Date().toISOString(), data: S }, null, 2)], { type: "application/json" });
  const filename = `bank-checklist-${new Date().toISOString().slice(0, 10)}.json`;
  /* Inside claude.ai a page can't download directly; the viewer confirms the save instead. */
  let dl = null; try { dl = window.claude?.use ? await window.claude.use("downloads") : null } catch (e) {}
  if (dl) {
    try { await dl.save({ filename, data: blob }); toast(t("backupSaved")) }
    catch (e) { if (e?.code !== "declined") toast(t("backupFail")) }
    return;
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(t("backupSaved"));
}
function restore(file) {
  if (!file) return;
  file.text().then(txt => {
    const j = JSON.parse(txt), d = j?.app === "bank-checklist" ? j.data : null;
    if (!d) throw 0;
    S = normalise(d); ui.sheet = null; save(); toast(t("restored"));
  }).catch(() => toast(t("badFile")));
}

/* Colour scheme: auto follows the device; light or dark is saved under "nurnhe-theme",
   one key shared with the other apps on nurnhe.github.io so switching in one switches them all. */
const THEME_KEY = "nurnhe-theme";
function themePref() { try { const v = localStorage.getItem(THEME_KEY); return v === "light" || v === "dark" ? v : "auto" } catch (e) { return "auto" } }
function applyTheme(v) {
  if (v === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = v;
  document.querySelectorAll("[data-act=theme]").forEach(b => b.setAttribute("aria-pressed", b.dataset.theme === v));
  const dark = v === "dark" || v === "auto" && matchMedia("(prefers-color-scheme: dark)").matches;
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => { m.content = dark ? "#0E1217" : "#F3F0E8"; m.removeAttribute("media") });
}
function setTheme(v) { try { localStorage.setItem(THEME_KEY, v) } catch (e) {} applyTheme(v) }
addEventListener("storage", e => { if (e.key === THEME_KEY) applyTheme(themePref()) });
applyTheme(themePref());
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => applyTheme(themePref()));

/* ---------- boot ---------- */
document.querySelectorAll("[data-nav]").forEach(svg => svg.innerHTML = NAV_ICONS[svg.dataset.nav]);
/* Remember which banks are open so redrawing the list keeps them open. */
document.addEventListener("toggle", e => { const id = e.target.dataset?.bank; if (id && e.target.classList.contains("bank")) e.target.open ? ui.open.add(id) : ui.open.delete(id) }, true);
addEventListener("keydown", e => { if (e.key === "Escape" && ui.sheet) closeSheet() });
render();
(async () => {
  try { db = window.claude?.use ? await window.claude.use("db") : null } catch (e) { db = null }
  if (!db) { loadLocal(); return }
  mode = "db";
  const slow = setTimeout(() => { if (!S) setStatus("stSlow") }, 10000);
  db.doc("checklist/main").onSnapshot(s => {
    clearTimeout(slow);
    if (!s.exists) { S = starter(); persist(); render(); return }
    const d = s.data(), next = normalise(d);
    if (S && JSON.stringify(next) === JSON.stringify(S)) return;
    S = next; render();
    if (d.v !== 3) persist();
  }, () => { clearTimeout(slow); setStatus("stLost") });
  setStatus("stDb");
})();
</script>

<script>if ("serviceWorker" in navigator) {
  // When an update takes over from an older version, reload once so it shows straight away.
  let hadController = !!navigator.serviceWorker.controller, reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController && !reloaded) { reloaded = true; location.reload() } hadController = true });
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {});
}</script>
